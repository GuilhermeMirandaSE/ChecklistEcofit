<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EcoFit Opportunity Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  /* Paleta Schneider: verde da marca #009530, Life Green #3DCD58 */
  --bg:#f1f5f2; --surface:#ffffff; --ink:#0f2318; --muted:#4f6357; --line:#d3e1d7; --field:#f5f8f6;
  --brand:#3dcd58; --on-brand:#062812; --brand-soft:#dff5e4; --brand-strong:#00742a; --sg:#009530; --band:#00742a;
  --focus:#00612a; --bad:#b3261e; --bad-soft:#fdeceb; --warn:#f28c1f;
  --t-eco:#00742a; --t-retro:#0a6b4a; --t-pd:#0d5a5f; --t-sub:#1a4d73; --t-neutral:#3d4a43;
  --l-eco:#3dcd58; --l-retro:#3dcd58; --l-pd:#3dcd58; --l-sub:#3dcd58; --l-off:#d3ddd6;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-head:"Barlow Semi Condensed","Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1611; --surface:#13231a; --ink:#e8f2ea; --muted:#a3b8aa; --line:#25382c; --field:#1a2c21;
    --brand:#3dcd58; --on-brand:#062812; --brand-soft:#173324; --brand-strong:#5fe07a; --sg:#3dcd58; --band:#0a3d1f;
    --focus:#7be495; --bad:#ff8a80; --bad-soft:#3a1f1d;
    --l-off:#2f4136;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1611; --surface:#13231a; --ink:#e8f2ea; --muted:#a3b8aa; --line:#25382c; --field:#1a2c21;
    --brand:#3dcd58; --on-brand:#062812; --brand-soft:#173324; --brand-strong:#5fe07a; --sg:#3dcd58; --band:#0a3d1f;
    --focus:#7be495; --bad:#ff8a80; --bad-soft:#3a1f1d;
    --l-off:#2f4136;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:clip}
.app{max-width:780px;margin:0 auto;padding:0 16px 0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* Cabeçalho */
.top{position:relative;isolation:isolate;display:flex;align-items:center;gap:14px;margin-bottom:24px;padding:16px 0;clip-path:inset(0 -100vmax -5px -100vmax)}
.top::before{content:"";position:absolute;z-index:-1;top:0;bottom:0;left:-100vmax;right:-100vmax;background:var(--band)}
.top::after{content:"";position:absolute;z-index:-1;bottom:-5px;height:5px;left:-100vmax;right:-100vmax;background:var(--brand)}
.top>div:last-child{min-width:0}
.logo{flex:none;background:#fff;border-radius:10px;padding:5px 9px;display:grid;place-items:center}
.logo img{display:block;height:40px;width:auto}
@media (max-width:520px){.top{gap:10px;margin-bottom:18px;padding:12px 0}.top h1{font-size:21px}.top p{display:none}.logo img{height:34px}}
.mark{flex:none;width:40px;height:40px;border-radius:10px;background:var(--brand);display:grid;place-items:center}
.mark svg{width:22px;height:22px;fill:none;stroke:var(--on-brand);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.top h1{margin:0;font:700 24px/1.1 var(--font-head);letter-spacing:.005em;color:#fff}
.top p{margin:2px 0 0;color:rgba(255,255,255,.88);font-size:15px}

/* Etapas */
.stepper{list-style:none;margin:0 0 18px;padding:0;display:flex}
.stepper li{flex:1;position:relative;min-width:0}
.stepper li:not(:last-child)::after{content:"";position:absolute;top:17px;left:calc(50% + 20px);right:calc(-50% + 20px);height:3px;border-radius:2px;background:var(--line)}
.stepper li.done:not(:last-child)::after{background:var(--brand)}
.stepper button{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;cursor:pointer;padding:0 2px}
.stepper button:disabled{cursor:default}
.stepper button:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.node{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:600 15px var(--font-head);background:var(--surface);border:2px solid var(--line);color:var(--muted)}
.stepper .done .node{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.stepper .current .node{border-color:var(--sg);color:var(--brand-strong);box-shadow:0 0 0 4px var(--brand-soft)}
.lbl{display:none;font-size:13px;line-height:1.2;color:var(--muted);text-align:center}
.stepper .current .lbl{display:block;color:var(--ink);font-weight:600}
@media (min-width:640px){.lbl{display:block}}
@media (max-width:639px){
  .stepper{margin-bottom:8px}
  .stepper li.current{flex:2.4}
  .stepper li:not(:last-child)::after{left:calc(50% + 20px);right:calc(-50% + 20px)}
}

/* Cartão de perguntas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 20px;margin-bottom:16px}
.card h2{margin:0 0 4px;font:700 28px/1.1 var(--font-head);color:var(--brand-strong)}
.intro{margin:0 0 20px;color:var(--muted)}
.q{padding:16px 0;border-top:1px solid var(--line);border-radius:10px}
.q:first-of-type{border-top:0;padding-top:4px}
.ql{font-weight:600;margin-bottom:8px;max-width:60ch}
.tag{font-weight:400;color:var(--muted);font-size:14px;margin-left:6px}
.hint{color:var(--muted);font-size:15px;margin:-4px 0 10px;max-width:62ch}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt{position:relative;display:block}
.opt input{position:absolute;z-index:1;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:48px;padding:10px 18px;border-radius:12px;border:2px solid var(--line);background:var(--field);font-weight:500;transition:background-color .12s,border-color .12s,color .12s}
.opt input:checked + span{background:var(--brand);border-color:var(--sg);color:var(--on-brand);font-weight:600}
.opt input:focus-visible + span{outline:3px solid var(--focus);outline-offset:2px}
.opts:not(.grid) .opt span{min-width:96px}
.opt span{flex-direction:column;gap:1px}
.opt span small{display:block;font-size:12.5px;font-weight:400;opacity:.78;line-height:1.25}
.pill{flex:none;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;margin-left:2px}
.pill.legacy{background:color-mix(in srgb,var(--warn) 26%,transparent);color:var(--ink)}
.pill.eco{background:var(--brand-soft);color:var(--brand-strong)}
.opt-none{margin-left:10px;padding-left:10px;border-left:2px solid var(--line)}
.opt input:disabled + span{opacity:.4;cursor:not-allowed}
.txt{width:100%;max-width:520px;min-height:48px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--field)}
.txt:focus-visible{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 30%,transparent)}
textarea.obs{min-height:76px;resize:vertical;font:inherit;line-height:1.4}
.upd-hint{display:block;margin-top:4px;font-weight:400;color:var(--muted);font-size:13px;line-height:1.35}
.suggest-box{display:grid;gap:8px;margin-top:10px}
.suggest-chip{background:var(--brand-soft);border:1px solid var(--sg);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:400;color:var(--ink);display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;justify-content:space-between}
.suggest-actions{display:flex;gap:8px;flex:none}
.btn.sm{min-height:36px;padding:6px 14px;font-size:14px}
.obs-echo{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--field);border:1px dashed var(--line);font-size:14px;color:var(--muted);font-weight:400}
.err{display:none;margin-top:8px;color:var(--bad);font-size:15px;font-weight:500}
.q.bad{background:var(--bad-soft);outline:2px solid var(--bad);outline-offset:0;padding-left:12px;padding-right:12px;margin-left:-12px;margin-right:-12px}
.q.bad .err{display:block}

/* Barra de navegação */
.nav{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);margin-top:8px}
.count{color:var(--muted);font-size:15px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 24px;border-radius:12px;font-weight:600;border:2px solid var(--line);background:var(--surface);text-align:center}
.btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:color-mix(in srgb,var(--brand) 88%,#000);border-color:color-mix(in srgb,var(--brand) 88%,#000)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}

/* Resultado */
.verdict{border-radius:18px;padding:24px 22px 26px;color:#fff;margin-bottom:16px;background:var(--tone);border-bottom:7px solid var(--brand)}
.verdict.sec{background:var(--surface);color:var(--ink);border:2px solid var(--tone);border-bottom:2px solid var(--tone);padding:16px 18px}
.verdict.sec .ctx{color:var(--tone);opacity:1;font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:.04em;margin-bottom:6px}
.verdict.sec h2{font-size:20px;color:var(--tone)}
.verdict.sec .msg{color:var(--ink);font-size:15px}
.why{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.why b{display:block;margin-bottom:6px}
.why p{margin:0 0 6px}
.verdict .ctx{margin:0 0 14px;font-size:15px;opacity:.85}
.verdict h2{margin:0 0 8px;font:700 clamp(30px,7vw,42px)/1.02 var(--font-head)}
.verdict p.msg{margin:0;font-size:18px;max-width:52ch}
.tone-eco{--tone:var(--t-eco)} .tone-retrofit{--tone:var(--t-retro)} .tone-prodiag{--tone:var(--t-pd)} .tone-sub{--tone:var(--t-sub)} .tone-nutrir{--tone:var(--t-neutral)} .tone-foraCatalogo{--tone:var(--t-neutral)}
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.gauge{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px}
.g-name{font-size:14px;color:var(--muted)}
.g-level{font:700 24px/1.15 var(--font-head);margin:2px 0 8px;color:var(--brand-strong)}
.lamps{display:flex;gap:6px}
.lamps i{width:18px;height:18px;border-radius:50%;background:var(--l-off);border:1px solid color-mix(in srgb,var(--ink) 12%,transparent)}
.lamps i.on{background:var(--lamp);box-shadow:0 0 0 3px color-mix(in srgb,var(--lamp) 30%,transparent);border-color:var(--sg)}
.g-why{margin:8px 0 0;font-size:13px;line-height:1.35;color:var(--muted)}
.k-eco{--lamp:var(--l-eco)} .k-retro{--lamp:var(--l-retro)} .k-pd{--lamp:var(--l-pd)} .k-sub{--lamp:var(--l-sub)}
.section{margin:0 0 16px}
.section h3{margin:0 0 10px;font:700 22px/1.15 var(--font-head);color:var(--brand-strong)}
.card.tight{padding:18px 20px}
.facts{margin:0;display:grid;grid-template-columns:minmax(0,190px) 1fr;gap:10px 16px}
.facts dt{color:var(--muted);font-size:15px}
.facts dd{margin:0;font-weight:500}
@media (max-width:520px){.facts{grid-template-columns:1fr;gap:0}.facts dd{margin-bottom:10px}}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--field);cursor:pointer}
.checks input{flex:none;width:22px;height:22px;margin:2px 0 0;accent-color:var(--sg)}
.checks input:checked + span{text-decoration:line-through;color:var(--muted)}
.bul{margin:0;padding-left:20px;display:grid;gap:4px}
.args{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.args li{padding:12px 14px;border-radius:12px;background:var(--field);max-width:70ch}
.offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.offer{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.offer b{display:block;font:700 19px/1.2 var(--font-head);margin-bottom:2px}
.offer span{color:var(--muted);font-size:15px}
.gaps{margin:0;padding-left:20px;display:grid;gap:4px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 20px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .15s;z-index:10}
.toast.show{opacity:1}
.foot{color:var(--muted);font-size:14px;padding:4px 0 24px}

/* Fabricante e busca */
.maker-btn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;max-width:520px;min-height:56px;padding:12px 18px;margin-bottom:10px;border-radius:12px;border:2px solid var(--line);background:var(--field);font-weight:600;font-size:18px}
.maker-btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.maker-btn .bolt{flex:none;width:30px;height:30px;border-radius:8px;background:var(--brand);display:grid;place-items:center}
.maker-btn .bolt svg{width:17px;height:17px;fill:none;stroke:var(--on-brand);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.maker-btn.on{background:var(--brand);border-color:var(--sg);color:var(--on-brand)}
.maker-btn.on .bolt{background:var(--on-brand)}
.maker-btn.on .bolt svg{stroke:var(--brand)}
@media (max-width:420px){.maker-btn.on::after{content:"\2713";font-size:18px;font-weight:700}}
.maker-btn.on::after{content:"Selecionado";margin-left:auto;font-size:14px;font-weight:500;opacity:.9}
.combo{position:relative;max-width:520px;scroll-margin-top:72px}
.combo .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.combo .txt{padding-left:42px}
.lb{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;margin:0;padding:6px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.2);max-height:264px;overflow:auto}
.lb li{padding:10px 12px;min-height:44px;display:flex;align-items:center;gap:8px;border-radius:8px;cursor:pointer}
.lb li small{color:var(--muted);font-size:14px}
.lb li .grp{margin-left:auto;padding-left:10px;color:var(--muted);font-size:13px;text-align:right}
.lb li.act,.lb li:hover{background:var(--brand-soft)}
.lb li.free{color:var(--brand-strong);font-weight:600}

/* E-mails */
.mail-names{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px;margin-bottom:6px}
.mail-l{display:block;font-weight:600;font-size:15px;margin:0 0 14px}
.mail-l .txt{display:block;margin-top:6px;font-weight:400;max-width:none}
.mail-kinds{margin-bottom:16px}
.mail-body{display:block;width:100%;margin-top:6px;min-height:280px;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--field);font:400 16px/1.55 var(--font-body);resize:vertical}
.mail-body:focus-visible{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 30%,transparent)}
.card .hint{margin:0 0 14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{
  :root{padding:0}
  body{background:#fff;color:#000}
  .stepper,.nav,.actions,.toast,.foot,.no-print{display:none!important}
  .card,.gauge,.offer{border-color:#999;break-inside:avoid}
  .top{background:none;box-shadow:none;clip-path:none;padding:0 0 10px}
  .top::before,.top::after{display:none}
  .top h1{color:#000}.top p{color:#333}
  .verdict{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .lamps i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<main class="app" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>

function todayISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDateBR(iso){if(!iso) return '';var p=iso.split('-');if(p.length!==3) return '';return p[2]+'/'+p[1]+'/'+p[0];}
function newState(){return {view:'form',step:0,max:0,a:{partes:[]},mail:{kind:'visita',contact:'',contactEmail:'',seller:'',subject:'',body:'',edited:false,date:todayISO(),update:''},suggestDismissed:{}};}
var state=newState();
var app=document.getElementById('app');
var toastEl=document.getElementById('toast');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function lowerFirst(s){return s.charAt(0).toLowerCase()+s.slice(1);}
function joinPt(arr){return arr.length<2?arr.join(''):arr.slice(0,-1).join(', ')+' e '+arr[arr.length-1];}
function reduceMotion(){return window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;}

/* ---------- Motor de análise ---------- */
var PARTES_NONE='Nenhuma — não vamos reaproveitar nada';
var RECUSA_NONE='Nenhuma recusa até agora';

/* Sugestões a partir de texto livre (observação do cliente / atualização do caso).
   Regras simples de palavra-chave + negação — nunca age sozinho, só sugere; o vendedor
   confirma com um clique. Se o texto não bater com nenhum padrão, nada aparece. */
var SUGGEST_RULES=[
 {key:'eco',label:'EcoFit / modernização',
   neg:/n[ãa]o\s+(quer|topa|aceita|deseja|precisa)(\s+\S+){0,4}\s*(ecofit|moderniza)/i,
   pos:/\b(quer|topa|aceita|deseja|interessad[oa])\b(\s+\S+){0,4}\s*(ecofit|moderniza)/i},
 {key:'retrofit',label:'Retrofit',
   neg:/n[ãa]o\s+(quer|topa|aceita|deseja|precisa)(\s+\S+){0,4}\s*retrofit/i,
   pos:/\b(quer|topa|aceita|deseja|interessad[oa])\b(\s+\S+){0,4}\s*retrofit/i},
 {key:'prodiag',label:'ProDiag / diagnóstico',
   neg:/n[ãa]o\s+(quer|topa|aceita|deseja|precisa)(\s+\S+){0,4}\s*(prodiag|diagn[oó]stico)/i,
   pos:/\b(quer|topa|aceita|deseja|interessad[oa])\b(\s+\S+){0,4}\s*(prodiag|diagn[oó]stico)/i},
 {key:'sub',label:'Substituição completa',
   neg:/n[ãa]o\s+(quer|topa|aceita|deseja|precisa)(\s+\S+){0,4}\s*(substitui|troca\s+completa|trocar\s+tudo)/i,
   pos:/\b(quer|topa|aceita|deseja|interessad[oa])\b(\s+\S+){0,4}\s*(substitui|troca\s+completa|trocar\s+tudo)/i}
];
function scanSuggestions(text){
  var out=[];
  if(!text) return out;
  SUGGEST_RULES.forEach(function(r){
    if(r.neg.test(text)) out.push({key:r.key,label:r.label,action:'add'});
    else if(r.pos.test(text)) out.push({key:r.key,label:r.label,action:'remove'});
  });
  return out;
}
function pendingSuggestions(text,source){
  var all=scanSuggestions(text);
  var recusa=state.a.recusa||[];
  return all.filter(function(s){
    var already=recusa.indexOf(s.label)>-1;
    if(s.action==='add'&&already) return false;
    if(s.action==='remove'&&!already) return false;
    return !state.suggestDismissed[source+':'+s.key+':'+s.action];
  });
}
function suggestBoxWrap(text,source){
  return '<div id="suggest-'+source+'">'+suggestionChipsHtml(text,source)+'</div>';
}
function refreshSuggestBox(source,text){
  var el=document.getElementById('suggest-'+source);
  if(el) el.outerHTML=suggestBoxWrap(text,source);
}
function suggestionChipsHtml(text,source){
  var sug=pendingSuggestions(text,source);
  if(!sug.length) return '';
  return '<div class="suggest-box">'+sug.map(function(s){
    var verb=s.action==='add'?'Marcar recusa':'Remover recusa';
    var msg=s.action==='add'?('Pelo texto, o cliente parece não querer '+s.label+'.'):('Pelo texto, o cliente parece ter mudado de ideia sobre '+s.label+'.');
    return '<div class="suggest-chip"><span>'+esc(msg)+'</span><span class="suggest-actions">'+
      '<button type="button" class="btn primary sm" data-act="apply-suggest" data-source="'+source+'" data-key="'+s.key+'" data-mode="'+s.action+'">'+verb+'</button>'+
      '<button type="button" class="btn sm" data-act="dismiss-suggest" data-source="'+source+'" data-key="'+s.key+'" data-mode="'+s.action+'">Ignorar</button>'+
      '</span></div>';
  }).join('')+'</div>';
}

   transformadores, relés de proteção e automação de subestação). Fora dessa lista, ainda não temos

var ECOFIT_SCOPE=['Disjuntor MT','Disjuntor BT','ATS','Relé de proteção','Cubículo MT','Transformador',
 'Carro extraível de média tensão','Contator de média tensão','Contator','Relé de sobrecarga','Disjuntor-motor',

/* Por que este diagnóstico — motivos em linguagem simples, para o vendedor explicar ao cliente */
function motivosList(A){
  var L=situacaoList(A).slice();
  function is(k,v){return A[k]===v;}
  if(is('atende','Sim')) L.push('o equipamento ainda atende bem a operação hoje');
  else if(is('atende','Parcialmente')) L.push('o equipamento atende só parcialmente a necessidade atual');
  else if(is('atende','Não')) L.push('o equipamento não atende mais a necessidade da operação');
  if(is('estrutura','Sim')) L.push('a estrutura física está preservada');
  else if(is('estrutura','Não')) L.push('a estrutura física já está comprometida');
  if(is('evitar','Sim')) L.push('o cliente quer evitar a troca completa');
  if(is('contrato','Sim')) L.push('já existe contrato de serviço recorrente com a Schneider');
  return L;
}
function analyze(A){
  function is(k,v){return A[k]===v;}
  var ageMap={'Menos de 10 anos':0,'Entre 10 e 15 anos':1,'Entre 15 e 20 anos':2,'Mais de 20 anos':3};
  var ageIdx=(A.idade in ageMap)?ageMap[A.idade]:null;
  var ageOld=ageIdx!==null&&ageIdx>=2;
  var partesRaw=A.partes||[];
  var partesNone=partesRaw.indexOf(PARTES_NONE)>-1;
  var partes=(partesNone||is('reaproveitar','Não'))?[]:partesRaw;
  var issues=['desgaste','falhas','pecas','obsolescencia'].filter(function(k){return is(k,'Sim');}).length;
  var me=modelEntry(A.modelo);
  var legacyModel=!!(me&&me.tag==='Descontinuado');
  var pressure=(ageIdx===null?1:ageIdx)+issues+(legacyModel?1:0);
  var severe=is('obsolescencia','Sim')&&is('pecas','Sim')&&ageOld;
  var flags6=[is('condicao','Não'),is('duvidas','Sim')].filter(Boolean).length;
  var unknowns=[ageIdx===null,is('desgaste','Não sei'),is('pecas','Não sei'),is('estrutura','Não sei'),is('problema','Não sei'),is('reaproveitar','Não sei')].filter(Boolean).length;
  var impHigh=A.impacto==='Alto'||A.impacto==='Crítico';

  /* Substituição */
  var subFlags=[is('estrutura','Não'),is('reaproveitar','Não'),severe,is('atende','Não')].filter(Boolean).length;
  var subIndicated=is('estrutura','Não')||(is('reaproveitar','Não')&&(is('atende','Não')||severe))||(is('atende','Não')&&severe&&!is('estrutura','Sim'));
  var sub=subIndicated?3:((subFlags>=2||is('atende','Não')||is('reaproveitar','Não'))?2:1);
  var subWhy;
  if(subIndicated){
    var subR=[];
    if(is('estrutura','Não')) subR.push('a estrutura física já está comprometida');
    if(is('reaproveitar','Não')&&is('atende','Não')) subR.push('não há nada para reaproveitar e o equipamento não atende mais a operação');
    else if(is('reaproveitar','Não')&&severe) subR.push('não há nada para reaproveitar e o ativo já está obsoleto, com peças difíceis de achar');
    if(is('atende','Não')&&severe&&!is('estrutura','Sim')&&!subR.length) subR.push('o equipamento não atende mais a operação e já está obsoleto, sem confirmação de que a estrutura esteja preservada');
    subWhy='Alto porque '+(subR.length?subR.join('; e '):'a estrutura ou a operação já não sustentam o equipamento')+'.';
  }else if(sub===2){
    var subR2=[];
    if(is('atende','Não')) subR2.push('o equipamento não atende mais a operação');
    if(is('reaproveitar','Não')) subR2.push('não há nada identificado para reaproveitar');
    if(!subR2.length) subR2.push('mais de um sinal de risco apareceu (estrutura, reaproveitamento, obsolescência ou idade)');
    subWhy='Médio porque '+subR2.join(' e ')+', mas não o bastante para indicar a troca com clareza.';
  }else{
    subWhy='Baixo porque a estrutura está preservada e não há sinais fortes de que o equipamento precise ser todo substituído.';
  }

  /* EcoFit */
  var ecoCrit=[ageOld,is('estrutura','Sim'),(is('reaproveitar','Sim')||partes.length>0),is('evitar','Sim'),is('atende','Sim')];
  var c=ecoCrit.filter(Boolean).length;
  var eco;
  if(is('estrutura','Não')) eco=1;
  else if(is('estrutura','Sim')&&is('atende','Sim')&&ageOld&&ecoCrit[2]&&!is('evitar','Não')) eco=3;
  else eco=(c>=3&&pressure>=2)?2:1;
  var ecoWhy;
  if(is('estrutura','Não')){
    ecoWhy='Baixo porque a estrutura física não está preservada — sem uma base física para manter, não há o que modernizar com o EcoFit.';
  }else if(eco===3){
    ecoWhy='Alto porque a estrutura está preservada, o equipamento ainda atende à operação, é antigo o bastante para valer a pena modernizar, há algo para reaproveitar e o cliente não rejeitou evitar a troca completa.';
  }else if(eco===2){
    ecoWhy='Médio: vários sinais são favoráveis, mas falta força (idade, uso atual ou intenção do cliente) para ser Alto.';
  }else{
    var ecoMiss=[];
    if(!ageOld) ecoMiss.push('o equipamento ainda não é antigo o bastante');
    if(!is('estrutura','Sim')) ecoMiss.push('a estrutura ainda não foi confirmada como preservada');
    if(!(is('reaproveitar','Sim')||partes.length>0)) ecoMiss.push('não foi identificado o que reaproveitar');
    if(is('evitar','Não')) ecoMiss.push('o cliente não demonstrou querer evitar a troca completa');
    if(!is('atende','Sim')) ecoMiss.push('o equipamento não atende mais bem a operação');
    ecoWhy='Baixo porque '+(ecoMiss.length?ecoMiss.join('; '):'faltam sinais suficientes para indicar potencial')+'.';
  }

  /* Retrofit */
  var r=0;
  if(!is('estrutura','Não')){
    r+=is('estrutura','Sim')?2:1;
    r+=is('atende','Parcialmente')?2:(is('atende','Não')?1:0);
    r+=is('problema','Sim')?2:(is('problema','Não sei')?1:0);
    r+=pressure>=3?1:0;
    r+=is('reaproveitar','Sim')?1:0;
  }
  var retro=r>=6?3:(r>=4?2:1);
  var retroWhy;
  if(is('estrutura','Não')){
    retroWhy='Baixa porque a estrutura comprometida inviabiliza o retrofit — sem estrutura para manter, não há o que atualizar.';
  }else{
    var retroC=[];
    if(is('estrutura','Sim')) retroC.push('a estrutura está preservada');
    if(is('atende','Parcialmente')) retroC.push('o equipamento atende só parcialmente');
    else if(is('atende','Não')) retroC.push('o equipamento não atende mais bem');
    if(is('problema','Sim')) retroC.push('o problema está concentrado em poucos componentes');
    else if(is('problema','Não sei')) retroC.push('ainda não se sabe onde está o problema');
    if(pressure>=3) retroC.push('há bastante idade/desgaste acumulado');
    if(is('reaproveitar','Sim')) retroC.push('há potencial de reaproveitamento');
    if(retro===3) retroWhy='Alta porque '+retroC.join(', ')+' — vários sinais juntos apontam para um retrofit bem direcionado.';
    else if(retro===2) retroWhy='Média porque '+(retroC.length?retroC.join(', '):'alguns sinais apareceram')+', mas ainda não o bastante para ser Alta.';
    else retroWhy='Baixa porque poucos sinais apontam para retrofit'+(retroC.length?' (só: '+retroC.join(', ')+')':'')+'.';
  }

  /* Resultado principal — respeita o que o cliente já recusou explicitamente */
  var inScope=ECOFIT_SCOPE.indexOf(typeOf(A))>-1;
  var EXCL_MAP={'EcoFit / modernização':'eco','Retrofit':'retrofit','ProDiag / diagnóstico':'prodiag','Substituição completa':'sub'};
  var excluded=(A.recusa||[]).map(function(x){return EXCL_MAP[x];}).filter(Boolean);
  function notExcl(k){return excluded.indexOf(k)<0;}
  var candidates=[];
  if(subIndicated&&notExcl('sub')) candidates.push('sub');
  if(flags6===2&&notExcl('prodiag')) candidates.push('prodiag');
  if(eco===3){
    var ecoPick=inScope?'eco':(retro>=2?'retrofit':'foraCatalogo');
    if(notExcl(ecoPick)) candidates.push(ecoPick);
  }
  if(((retro>=2&&(pressure>=2||!is('atende','Sim')))||is('atende','Parcialmente'))&&notExcl('retrofit')) candidates.push('retrofit');
  if(pressure>=3&&notExcl('prodiag')) candidates.push('prodiag');
  candidates.push('nutrir');
  var key=candidates[0];

  /* ProDiag */
  var pd=1;
  if(key==='prodiag') pd=flags6>=2?3:2;
  else if(key==='retrofit') pd=2;
  else if(flags6>=1||is('estrutura','Não sei')||unknowns>=2) pd=2;
  var pdWhy;
  if(pd===3){
    pdWhy='Necessário porque você ainda não sabe a condição real do equipamento e o cliente também demonstrou dúvida — hoje a decisão seria no escuro.';
  }else if(pd===2){
    var pdR=[];
    if(key==='retrofit') pdR.push('um retrofit bem direcionado depende de confirmar a condição real do ativo');
    if(flags6>=1) pdR.push('falta confirmar a condição do ativo ou ficou uma dúvida do cliente em aberto');
    if(is('estrutura','Não sei')) pdR.push('a estrutura ainda não foi avaliada');
    if(unknowns>=2&&!pdR.length) pdR.push('há várias respostas "não sei" no checklist');
    pdWhy='Recomendado porque '+(pdR.length?pdR.join('; e '):'ainda há pontos incertos')+'.';
  }else{
    pdWhy='Opcional porque a condição do ativo já está razoavelmente clara pelas respostas dadas.';
  }

  /* Reaproveitamento */
  var reuse;
  if(partesNone||is('estrutura','Não')||is('reaproveitar','Não')) reuse='Baixo ou inexistente';
  else if(is('estrutura','Sim')&&(is('reaproveitar','Sim')||partes.length)) reuse='Sim'+(partes.length?': '+partes.join(', ').toLowerCase():'');
  else reuse='A confirmar com o especialista';

  var CONTENT={
    eco:{title:'Alto potencial para EcoFit',
      msg:'Este ativo apresenta forte potencial para modernização através do EcoFit.',
      need:'O cliente quer manter a operação funcionando com o mínimo de investimento e de tempo parado, sem abrir mão de segurança — não precisa trocar tudo, só o que já está desgastado.',
      benefits:['Investimento menor que uma troca completa: você mostra economia de CAPEX sem abrir mão de qualidade, o que ajuda quando o orçamento do cliente é o obstáculo.',
       'Menos tempo de parada: como boa parte da estrutura é reaproveitada, a intervenção costuma ser mais rápida que uma obra de substituição — use isso para reduzir a objeção de "não posso desligar a planta".',
       'Vida útil estendida com tecnologia atual: o cliente moderniza a proteção e o controle sem esperar o orçamento de uma troca completa ser aprovado.',
       'Argumento de sustentabilidade: menos resíduo e menos consumo de matéria-prima que uma substituição total — útil se o cliente tem metas de ESG.'],
      next:['Propor o EcoFit ao cliente','Envolver o Especialista de Modernização','Oferecer o ProDiag se a condição real ainda precisar ser confirmada'],
      expert:'Especialista de Modernização'},
    retrofit:{title:'Potencial para retrofit',
      msg:'Existe potencial para retrofit parcial e atualização tecnológica.',
      need:'O cliente precisa resolver um problema específico — proteção, controle ou comunicação desatualizados — sem reformar a instalação inteira.',
      benefits:['Resolve o problema específico (proteção, controle ou comunicação) sem reformar a instalação inteira — você foca a proposta no que realmente incomoda o cliente.',
       'Atualiza a tecnologia de proteção e controle para o padrão atual, o que ajuda a justificar o investimento por segurança, não só por estética.',
       'Investimento e prazo menores que uma substituição completa — bom argumento se o cliente já sinalizou pressa ou orçamento limitado.'],
      next:['Propor o retrofit','Agendar uma avaliação técnica','Incluir o ProDiag para validar a condição do ativo'],
      expert:'Especialista de Modernização, para a avaliação técnica'},
    prodiag:{title:'ProDiag recomendado',
      msg:'Antes de definir uma estratégia de modernização ou substituição, recomenda-se realizar um diagnóstico especializado dos ativos.',
      need:'Antes de qualquer decisão, é preciso ter dados confiáveis sobre o estado real do equipamento — hoje a decisão estaria sendo tomada no escuro.',
      benefits:['Dá segurança técnica para a sua proposta: você chega com dados do próprio ativo, não com uma estimativa genérica.',
       'Reduz o risco de oferecer a solução errada (e de o cliente descobrir isso depois de fechar) — protege a sua credibilidade com ele.',
       'Abre naturalmente a porta para a conversa de modernização: depois do diagnóstico, é você quem já está na mesa para propor o próximo passo.'],
      next:['Propor o ProDiag','Envolver o Especialista Schneider'],
      expert:'Especialista Schneider, para conduzir o diagnóstico'},
    sub:{title:'Avaliar substituição completa',
      msg:'A substituição completa pode representar a solução mais adequada para garantir confiabilidade e segurança.',
      need:'A estrutura ou a tecnologia atual já não sustentam mais a operação com segurança — o cliente precisa de um ativo novo, não de um reparo.',
      benefits:['Argumento de segurança e confiabilidade: quando a estrutura já está comprometida, reforçar o risco de continuar operando ajuda a justificar o investimento maior.',
       'Suporte e peças garantidos com equipamento atual — elimina a dor recorrente de não achar peça de reposição.'],
      next:['Propor a renovação','Estruturar o projeto de substituição','Envolver o Especialista Schneider'],
      expert:'Especialista Schneider, para o projeto de substituição'},
    nutrir:{title:'Sem urgência identificada',
      msg:'As respostas não indicam necessidade imediata. Vale manter o relacionamento e acompanhar o ativo.',
      need:'Não há uma dor imediata a resolver agora. O valor aqui é manter relacionamento e visibilidade, para estar pronto quando isso mudar.',
      benefits:['Mantém você no radar do cliente para quando a necessidade aparecer — sem essa avaliação, você não teria motivo para voltar a falar com ele agora.',
       'Mostra cuidado e conhecimento técnico, sem parecer forçar uma venda que ele ainda não precisa — isso constrói confiança para a próxima oportunidade.'],
      next:['Registrar o ativo e as informações levantadas','Combinar uma nova conversa de acompanhamento','Envolver o especialista Schneider se o cenário mudar'],
      expert:'Nenhum por enquanto. Envolver o especialista Schneider se o cenário mudar'},
    foraCatalogo:{title:'Fora do catálogo EcoFit documentado',
      msg:'O catálogo EcoFit que recebemos cobre média/baixa tensão, transformadores, relés de proteção e automação de subestação. Este equipamento não está nele.',
      need:'Confirmar com o especialista Schneider qual programa de modernização existe para este tipo de equipamento — pode não ser o EcoFit.',
      benefits:['Mostra que você pesquisou antes de empurrar uma oferta genérica — passa profissionalismo mesmo sem ter a resposta pronta na hora.',
       'Abre espaço para o especialista indicar o programa certo, e você continua sendo o ponto de contato do cliente durante esse processo.'],
      next:['Consultar o especialista Schneider sobre a oferta aplicável a este equipamento','Oferecer o ProDiag se a condição real ainda não for conhecida'],
      expert:'Especialista Schneider'}
  };
  var C=CONTENT[key];
  var next=C.next.slice();
  if(key==='prodiag'&&(eco>=2||retro>=2)) next.push('Registrar que já há sinais de potencial EcoFit ou retrofit, para confirmar o escopo depois do diagnóstico');
  if(excluded.length){
    var EXCL_KW={eco:['ecofit','moderniza'],retrofit:['retrofit'],prodiag:['prodiag','diagnóstic'],sub:['substitui','renova']};
    var stripFn=function(txt){
      var low=txt.toLowerCase();
      return excluded.some(function(ex){return (EXCL_KW[ex]||[]).some(function(kw){return low.indexOf(kw)>-1;});});
    };
    next=next.filter(function(n){return !stripFn(n);});
  }

  /* Segundo potencial a considerar, além do principal */
  var secKey=null;
  if(key==='eco'){ if(retro>=2&&notExcl('retrofit')) secKey='retrofit'; else if(pd>=2&&notExcl('prodiag')) secKey='prodiag'; }
  else if(key==='retrofit'){ if(inScope&&eco>=2&&notExcl('eco')) secKey='eco'; else if(pd>=2&&notExcl('prodiag')) secKey='prodiag'; }
  else if(key==='prodiag'){ if(inScope&&eco>=2&&notExcl('eco')) secKey='eco'; else if(retro>=2&&notExcl('retrofit')) secKey='retrofit'; }
  else if(key==='sub'){ if(pd>=2&&notExcl('prodiag')) secKey='prodiag'; }
  else if(key==='foraCatalogo'){ if(retro>=2&&notExcl('retrofit')) secKey='retrofit'; else if(pd>=2&&notExcl('prodiag')) secKey='prodiag'; }
  var secC=secKey?CONTENT[secKey]:null;

  /* Especialista: sinaliza porte/criticidade em vez de inventar um cargo específico */
  var expert=C.expert+(A.impacto==='Crítico'?' — pelo porte/criticidade, vale levar um especialista sênior.':'');

  /* Particularidade do produto (só quando há fonte confirmada) */
  var part=PARTICULARIDADES[typeOf(A)]||null;

  /* Pontos a confirmar */
  var gaps=[];
  if(ageIdx===null) gaps.push('Confirmar o ano de instalação (placa de identificação ou documentação do ativo).');
  if(is('desgaste','Não sei')) gaps.push('Verificar sinais de desgaste em visita ou com a manutenção do cliente.');
  if(is('pecas','Não sei')) gaps.push('Consultar a disponibilidade de peças de reposição.');
  if(is('estrutura','Não sei')) gaps.push('Confirmar o estado da estrutura física (cubículo, compartimentos, painel).');
  if(is('problema','Não sei')) gaps.push('Identificar se o problema está concentrado em poucos componentes.');
  if(is('reaproveitar','Não sei')) gaps.push('Avaliar o potencial de reaproveitamento com o especialista.');
  if(is('evitar','Não sei')) gaps.push('Perguntar ao cliente se ele quer evitar a substituição completa.');
  if(!inScope&&(key==='foraCatalogo'||key==='retrofit'||key==='eco')) gaps.push('Este tipo de equipamento não consta no catálogo EcoFit que recebemos — confirme com o especialista qual oferta se aplica.');
  if(excluded.length) gaps.unshift('O cliente já descartou: '+A.recusa.join(', ')+'. Este diagnóstico já não considera essas opções.');

  var fabT=(A.fab||'').trim();
  if(fabT){
    if(fabT==='Schneider Electric'){
      if(!(me&&me.note)&&(key==='eco'||key==='retrofit'||key==='prodiag')) gaps.push('Consultar com o especialista o ciclo de vida do modelo (descontinuação e disponibilidade de peças).');
    }else if(key==='eco'||key==='retrofit'||key==='sub'){
      gaps.push('Confirmar com o Especialista de Modernização a solução para o modelo do fabricante '+fabT+' (o EcoFit também atende equipamentos de outras marcas).');
    }
  }

  if(me&&me.note) gaps.unshift('Modelo '+me.n+': '+me.note);

  return {key:key,C:C,next:next,eco:eco,retro:retro,pd:pd,sub:sub,reuse:reuse,gaps:gaps,flags6:flags6,secKey:secKey,secC:secC,expert:expert,part:part,inScope:inScope,reasons:motivosList(A),why:{eco:ecoWhy,retro:retroWhy,pd:pdWhy,sub:subWhy}};
}

  STEPS[state.step].qs.forEach(function(q){

    var el=app.querySelector('[data-q="'+q.id+'"]');
    if(el){var was=el.hidden;el.hidden=!q.showIf(state.a);if(was&&!el.hidden&&q.type==='combo'&&!noFocus){var ci=el.querySelector('input');if(ci) ci.focus();}}
  });

function validateStep(){
  var first=null;
  STEPS[state.step].qs.forEach(function(q){
    if(q.optional) return;
    if(q.showIf&&!q.showIf(state.a)) return;
    var ok;
    if(q.type==='single') ok=!!state.a[q.id];
    else if(q.type==='multi') ok=(state.a[q.id]||[]).length>0;
    else return;
    var el=app.querySelector('[data-q="'+q.id+'"]');
    if(el) el.classList.toggle('bad',!ok);
    if(!ok&&!first) first=el;
  });
  if(first){first.scrollIntoView({behavior:reduceMotion()?'auto':'smooth',block:'center'});return false;}
  return true;
}

function copyText(t){
  function fallback(){
    var ta=document.createElement('textarea');
    ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    var ok=false;try{ok=document.execCommand('copy');}catch(e){}
    document.body.removeChild(ta);return ok;
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    return navigator.clipboard.writeText(t).then(function(){return true;},function(){return fallback();});
  }
  return Promise.resolve(fallback());
}

function buildPdf(){

  var lampCol={eco:[61,205,88],retro:[61,205,88],pd:[61,205,88],sub:[61,205,88]};
  var PT=0.3528;
  function lh(size){return size*PT*1.4;}
  function room(h){if(y+h>PH-M-6){doc.addPage();y=M;}}
  function setText(size,style,col){doc.setFont('helvetica',style||'normal');doc.setFontSize(size);var c=col||INK;doc.setTextColor(c[0],c[1],c[2]);}
  function para(str,size,style,col,x,w){
    setText(size,style,col);
    var lines=doc.splitTextToSize(String(str),w||CW), h=lh(size);
    lines.forEach(function(l){room(h);doc.text(l,x==null?M:x,y+size*PT);y+=h;});
  }
  function heading(t){y+=5;room(14);para(t,13,'bold',[0,116,42]);y+=1;}
  function bullets(items){
    items.forEach(function(t){
      setText(10.5,'normal');
      var lines=doc.splitTextToSize(String(t),CW-6), h=lh(10.5);
      room(h);
      doc.setFillColor(INK[0],INK[1],INK[2]);doc.circle(M+1.4,y+h*0.45,0.55,'F');
      lines.forEach(function(l){room(h);doc.text(l,M+6,y+10.5*PT);y+=h;});
      y+=1;
    });
  }
  function checks(items){
    items.forEach(function(t){
      setText(10.5,'normal');
      var lines=doc.splitTextToSize(String(t),CW-8), h=lh(10.5);
      room(h);
      doc.setDrawColor(INK[0],INK[1],INK[2]);doc.setLineWidth(0.3);doc.rect(M,y+0.6,3.6,3.6);
      lines.forEach(function(l){room(h);doc.text(l,M+7,y+10.5*PT);y+=h;});

    });
  }

  /* Título */
  try{doc.addImage(LOGO,'PNG',PW-M-32,M-1,32,32*78/208);}catch(e){}
  para('EcoFit Opportunity Assistant',18,'bold',INK,M,CW-38);
  var ident=identLine(A);
  if(ident) para(ident,10.5,'normal',MUTED,M,CW-38);
  if(y<M+15) y=M+15;
  y+=2;

  /* Faixa de diagnóstico */
  var tc=tones[R.key];
  setText(9,'normal');
  var tLines=(setText(22,'bold'),doc.splitTextToSize(C.title,CW-12));
  var mLines=(setText(11,'normal'),doc.splitTextToSize(C.msg,CW-12));
  var bh=6+tLines.length*lh(22)+2+mLines.length*lh(11)+6;
  room(bh);
  doc.setFillColor(tc[0],tc[1],tc[2]);doc.roundedRect(M,y,CW,bh,3,3,'F');
  var by=y+6;
  setText(22,'bold',[255,255,255]);
  tLines.forEach(function(l){doc.text(l,M+6,by+22*PT);by+=lh(22);});
  by+=2;
  setText(11,'normal',[255,255,255]);
  mLines.forEach(function(l){doc.text(l,M+6,by+11*PT);by+=lh(11);});
  y+=bh+5;

  if(R.secC){
    var sc=tones[R.secKey];

function comboBits(input){var box=input.closest('.combo');return {lb:box.querySelector('.lb'),id:input.getAttribute('data-combo-input')};}
function openCombo(input){
  var c=comboBits(input), q=input.value, nq=norm(q), out=[];
  function hit(it){var hay=[it.n].concat(it.a||[]);return !nq||hay.some(function(h){return norm(h).indexOf(nq)>-1;});}
  if(c.id==='modelo'){
    var ml=modelLists();
    out=ml.typed.filter(hit);
    if(!out.length&&nq) out=ml.all.filter(hit);
  }else{
    COMBOS[c.id].forEach(function(it){
      if(c.id==='fab'&&!nq&&it.n==='Schneider Electric') return;
      if(hit(it)) out.push(it);
    });
  }
  out=out.slice(0,60);
  var html='', n=0;
  out.forEach(function(it){
    var alias='';
    if(nq&&norm(it.n).indexOf(nq)<0){alias=(it.a||[]).filter(function(a){return norm(a).indexOf(nq)>-1;})[0]||'';}
    html+='<li role="option" id="'+c.id+'-o'+(n++)+'" data-val="'+esc(it.n)+'">'+esc(it.n)+(alias?' <small>('+esc(alias)+')</small>':'')+(it.tag==='Descontinuado'?'<span class="pill legacy">Descontinuado</span>':'')+((it.g||it.f)?'<span class="grp">'+esc(it.g||it.f)+'</span>':'')+'</li>';
  });
  var exact=out.some(function(it){return norm(it.n)===nq;});
  if(q.trim()&&!exact) html+='<li role="option" class="free" id="'+c.id+'-o'+(n++)+'" data-val="'+esc(q.trim())+'">Usar “'+esc(q.trim())+'”</li>';
  c.lb.innerHTML=html;c.lb.hidden=!html;
  input.setAttribute('aria-expanded',html?'true':'false');
}
function closeCombo(input){var c=comboBits(input);c.lb.hidden=true;input.setAttribute('aria-expanded','false');input.removeAttribute('aria-activedescendant');}
function commitCombo(input){
  var id=input.getAttribute('data-combo-input'), v=input.value.trim();
  if(id==='fab'){
    if(v) state.a.fab=(norm(v)==='schneider electric'||norm(v)==='schneider')?'Schneider Electric':v;
    else if(state.a.fab!=='Schneider Electric') state.a.fab='';
    syncMaker();
  }else{
    state.a[id]=v;
    if(id==='modelo'){var me0=modelEntry(v);if(me0) applyModel(me0);}
  }
}
function pickFromLi(li){
  var box=li.closest('.combo'), input=box.querySelector('input'), id=input.getAttribute('data-combo-input'), val=li.getAttribute('data-val');
  state.a[id]=val;
  input.value=(id==='fab'&&val==='Schneider Electric')?'':val;
  closeCombo(input);
  if(id==='fab') syncMaker();
  if(id==='modelo'){var en=modelEntry(val);if(en) applyModel(en);}
}
function syncMaker(){
  var b=app.querySelector('.maker-btn'); if(!b) return;
  var on=state.a.fab==='Schneider Electric';
  b.classList.toggle('on',on);b.setAttribute('aria-pressed',on?'true':'false');
  var inp=app.querySelector('[data-combo-input="fab"]');
  if(inp&&on&&document.activeElement!==inp) inp.value='';
}
function comboKey(e,input){
  var c=comboBits(input), lis=[].slice.call(c.lb.querySelectorAll('li'));
  if(e.key==='Escape'){closeCombo(input);return;}
  if(e.key==='Enter'){
    e.preventDefault();
    var act=c.lb.querySelector('li.act');
    if(act&&!c.lb.hidden) pickFromLi(act); else {commitCombo(input);closeCombo(input);}
    return;
  }
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    if(c.lb.hidden){openCombo(input);lis=[].slice.call(c.lb.querySelectorAll('li'));}
    if(!lis.length) return;
    var cur=-1;lis.forEach(function(l,i){if(l.classList.contains('act')) cur=i;});
    cur=e.key==='ArrowDown'?(cur+1)%lis.length:(cur<=0?lis.length-1:cur-1);
    lis.forEach(function(l,i){l.classList.toggle('act',i===cur);l.setAttribute('aria-selected',i===cur?'true':'false');});
    input.setAttribute('aria-activedescendant',lis[cur].id);
    lis[cur].scrollIntoView({block:'nearest'});
  }
}

  var L=[];
  function is(k,v){return A[k]===v;}
  var ageTxt={'Menos de 10 anos':'menos de 10 anos','Entre 10 e 15 anos':'10 a 15 anos','Entre 15 e 20 anos':'15 a 20 anos','Mais de 20 anos':'mais de 20 anos'};
  var me=modelEntry(A.modelo);
  if(ageTxt[A.idade]) L.push('instalado há '+ageTxt[A.idade]);
  if(is('condicao','Não')||is('duvidas','Sim')) L.push('condição real ainda a confirmar');
  if(is('falhas','Sim')) L.push('falhas ou interrupções recorrentes');
  if(is('desgaste','Sim')) L.push('sinais de desgaste');
  if(is('pecas','Sim')) L.push('dificuldade para encontrar peças');
  if(is('obsolescencia','Sim')) L.push('preocupação com obsolescência');
  if(me&&me.tag==='Descontinuado') L.push('modelo descontinuado');
  if(A.impacto==='Alto'||A.impacto==='Crítico') L.push('impacto '+A.impacto.toLowerCase()+' em caso de falha');
  if(is('estrategico','Sim')) L.push('equipamento estratégico');
  if(is('restricao','Sim')) L.push('restrição para desligamento');
  return L;
}
/* Pergunta final de cada e-mail — mantém o assunto em aberto, sempre ligada ao diagnóstico */
var CLOSING_Q={
  eco:'Faz sentido conversarmos essa semana para eu mostrar como o EcoFit se encaixa nesse equipamento?',
  retrofit:'Posso te ligar para alinharmos o escopo do retrofit?',
  prodiag:'Prefere que eu já agende o ProDiag, ou batemos um papo antes?',
  sub:'Posso te ligar para conversarmos sobre os próximos passos da substituição?',
  nutrir:'Faz sentido eu voltar a falar com você daqui a algumas semanas?',
  foraCatalogo:'Posso confirmar com o especialista qual a melhor solução e te retorno em breve?'
};
function buildEmail(kind){
  var A=state.a, R=state.R||analyze(A), key=R.key, m=state.mail;
  var nome=tr(m.contact)||'[Nome do contato]', eu=tr(m.seller)||'[Seu nome]';
  var ativo=ativoDesc(A);
  var dateTxt=fmtDateBR(m.date)||'[data]';
  var OFFER={eco:'EcoFit',retrofit:'retrofit',prodiag:'ProDiag',sub:'renovação',nutrir:'acompanhamento',foraCatalogo:'modernização'}[key]||'modernização';
  var WHY={
    eco:'Com o EcoFit, aproveitamos parte da infraestrutura atual, com menor investimento e menos tempo de parada.',
    retrofit:'Com o retrofit, atualizamos proteção e controle e aproveitamos a estrutura que ainda é utilizável.',
    prodiag:'O ProDiag mostra a condição real do ativo e apoia a decisão entre modernizar ou substituir.',
    sub:'A substituição garante confiabilidade e segurança para a operação.',
    nutrir:'Acompanhar a condição do ativo ajuda a antecipar decisões.',
    foraCatalogo:'Ainda vou confirmar com o especialista qual programa de modernização se aplica a esse equipamento.'
  }[key];
  var LINE={
    eco:'aproveitar a infraestrutura atual, com menos investimento e menos tempo de parada.',
    retrofit:'atualizar proteção e controle, mantendo a estrutura utilizável.',
    prodiag:'conhecer a condição real do ativo antes de decidir.',
    sub:'garantir confiabilidade e segurança com a renovação.',
    nutrir:'acompanhar a condição do ativo para antecipar decisões.',
    foraCatalogo:'confirmar qual programa de modernização se aplica ao equipamento.'
  }[key];
  var sit=situacaoList(A).slice(0,4);
  var obs=sit.join(', ').replace(/, ([^,]*)$/,' e $1');
  var hello='Olá, '+nome+'! Tudo bem? Espero que você e sua equipe estejam bem.';
  var updTxt=tr(m.update).replace(/[.]+$/,'');
  var updateLine=updTxt?('Ponto que vale lembrar: '+updTxt+'.'):'';
  var closing=CLOSING_Q[key]||CLOSING_Q.nutrir;
  var parts=[], subject='';

  if(kind==='visita'){
    subject='Obrigado pela conversa: '+ativo;
    parts.push(hello,'Obrigado pela conversa do dia '+dateTxt+'. Foi ótimo conhecer melhor a operação e os desafios com '+ativo+'.');
    if(obs) parts.push('O que observamos: '+obs+'.\n'+WHY);
    else parts.push(WHY);
    if(updateLine) parts.push(updateLine);
    parts.push('Se algo acima não corresponder ao que vocês vivem no dia a dia, me avise. '+closing);
  }else if(kind==='proposta'){
    subject='Proposta de '+OFFER+': '+ativo;
    var scope=key==='prodiag'?'- [Escopo do diagnóstico]\n- [Data prevista]\n- [Condições comerciais e validade]':
      (key==='nutrir'||key==='foraCatalogo'?'- [Serviço proposto]\n- [Periodicidade ou prazo]\n- [Condições comerciais e validade]':
      '- [Escopo do que está incluído]\n- [Prazo e janela de parada prevista]\n- [Condições comerciais e validade]');
    parts.push(hello,'Depois da nossa conversa sobre a visita, segue em anexo a proposta de '+OFFER+' para '+ativo+'.');
    if(obs) parts.push('O que está acontecendo: '+obs+'.\n'+WHY);
    else parts.push(WHY);
    parts.push('A proposta traz:\n'+scope);
    if(updateLine) parts.push(updateLine);
    parts.push('Fico à disposição para qualquer dúvida. '+closing);
  }else if(kind==='followup'){
    subject='Acompanhamento da proposta: '+ativo;
    var extra=A.restricao==='Sim'?' Se a janela de parada for o desafio, podemos avaliar juntos como reduzir a intervenção.':'';
    parts.push('Olá, '+nome+'! Tudo bem? Espero que a semana esteja boa por aí.',
      'Passando para saber se você conseguiu analisar a proposta de '+OFFER+' que te enviei em '+dateTxt+' para '+ativo+'. O ponto central: '+LINE+extra);
    if(updateLine) parts.push(updateLine);
    parts.push('Posso ligar em [dia e horário] para conversarmos?');
  }else if(kind==='interno'){
    subject='Resumo da avaliação — '+ativo;
    var toDo=R.next.map(function(n){return '[ ] '+n;}).join('\n');
    parts.push('Resumo rápido para acompanhar este caso ('+dateTxt+').');
    parts.push('Contato: '+(tr(m.contact)||'(preencher)')+' — Ativo: '+ativo);
    parts.push('Diagnóstico: '+R.C.title+(R.secC?' (também vale considerar: '+R.secC.title+')':''));
    if(R.reasons.length) parts.push('Motivos: '+R.reasons.join('; ')+'.');
    parts.push('Próximas ações:\n'+toDo);
    if(updateLine) parts.push(updateLine);
  }else{
    subject='Acompanhamento: '+ativo;
    parts.push(hello,
      'Passando para saber como está a operação e se algo mudou em '+ativo+'. Se surgirem falhas, alarmes ou dificuldade com peças, me avise que avaliamos juntos os próximos passos.');
    if(updateLine) parts.push(updateLine);
    parts.push('Se fizer sentido, posso agendar uma conversa rápida de [15 min], ou responda com o que fizer mais sentido para você.');
  }
  return {subject:subject,body:parts.join('\n\n')};
}
function mailHtml(){
  var m=state.mail;
  var chips=MAIL_KINDS.map(function(k){
    return '<label class="opt"><input type="radio" name="mailkind" value="'+k.id+'"'+(m.kind===k.id?' checked':'')+'><span>'+esc(k.label)+'</span></label>';
  }).join('');
  return '<section class="card tight section no-print" aria-labelledby="mailTitle"><h3 id="mailTitle">E-mails prontos para o cliente</h3>'+
   '<p class="hint">Preencha os nomes, escolha o modelo e ajuste o texto. Complete os trechos entre [colchetes] antes de enviar.</p>'+
   '<div class="mail-names">'+
   '<label class="mail-l">Nome do contato<input class="txt" type="text" data-mail="contact" value="'+esc(m.contact)+'" placeholder="Ex.: Carlos" autocomplete="off"></label>'+
   '<label class="mail-l">E-mail do contato<span class="tag">opcional</span><input class="txt" type="email" data-mail="contactEmail" value="'+esc(m.contactEmail)+'" placeholder="Para abrir já preenchido no seu e-mail" autocomplete="off"></label>'+
   '<label class="mail-l">Seu nome<input class="txt" type="text" data-mail="seller" value="'+esc(m.seller)+'" placeholder="Como você assina" autocomplete="off"></label>'+
   '<label class="mail-l">Data<input class="txt" type="date" lang="pt-BR" data-mail="date" value="'+esc(m.date)+'"></label></div>'+
   '<label class="mail-l">Atualização do caso<span class="tag">opcional</span><textarea class="txt obs" data-mail="update" placeholder="O que mudou desde o último contato — ex.: cliente pediu desconto, está aguardando aprovação.">'+esc(m.update)+'</textarea><small class="upd-hint">Isso entra como uma linha na mensagem abaixo (e no resumo para você) sempre que você mudar este campo, mesmo que já tenha editado o texto.</small></label>'+suggestBoxWrap(m.update,'update')+
   '<div class="opts mail-kinds" role="radiogroup" aria-label="Modelo de e-mail">'+chips+'</div>'+
   '<label class="mail-l">Assunto<input class="txt" type="text" data-mail="subject" autocomplete="off"></label>'+
   '<label class="mail-l">Mensagem<textarea class="mail-body" data-mail="body" spellcheck="true"></textarea></label>'+
   '<div class="actions"><button type="button" class="btn primary" data-act="mailto">Abrir no seu e-mail</button>'+
   '<button type="button" class="btn" data-act="copy-body">Copiar mensagem</button>'+
   '<button type="button" class="btn" data-act="copy-subject">Copiar assunto</button></div>'+
   '<p class="hint" style="margin:8px 0 0">Se o e-mail vier cortado no seu programa de e-mail, copie a mensagem (botão acima) em vez de usar "Abrir no seu e-mail".</p>'+
   '<p class="hint" style="margin:0">Preencha os nomes antes de editar o texto: depois de editar, os nomes deixam de atualizar a mensagem sozinhos.</p></section>';
}
function autosize(t){t.style.height='auto';t.style.height=(t.scrollHeight+6)+'px';}
function mailFill(){
  var e=buildEmail(state.mail.kind);
  state.mail.subject=e.subject;state.mail.body=e.body;
  var s=app.querySelector('[data-mail="subject"]'), b=app.querySelector('[data-mail="body"]');
  if(s) s.value=e.subject;
  if(b){b.value=e.body;autosize(b);}
}
function syncUpdateLine(){
  var b=app.querySelector('[data-mail="body"]');
  if(!b) return;
  var updTxt=tr(state.mail.update).replace(/[.]+$/,'');
  var newLine=updTxt?('Ponto que vale lembrar: '+updTxt+'.'):'';
  var body=b.value;
  var re=/(^|\n\n)Ponto que vale lembrar: [\s\S]*?(?=\n\n|$)/;
  if(re.test(body)){
    body=newLine?body.replace(re,function(m,p1){return p1+newLine;}):body.replace(re,'').replace(/\n{3,}/g,'\n\n').trim();
  }else if(newLine){
    var paras=body.split('\n\n');
    if(paras.length>1){paras.splice(paras.length-1,0,newLine);body=paras.join('\n\n');}
    else body=body+'\n\n'+newLine;
  }
  b.value=body;state.mail.body=body;autosize(b);
}
function mailInput(f,el){
  if(f==='update'){
    state.mail.update=el.value;
    if(!state.mail.edited) mailFill(); else syncUpdateLine();
    return;
  }
  if(f==='contact'||f==='contactEmail'||f==='seller'||f==='date'){state.mail[f]=el.value;if(!state.mail.edited) mailFill();return;}
  if(f==='subject'){state.mail.subject=el.value;state.mail.edited=true;return;}
  if(f==='body'){state.mail.body=el.value;state.mail.edited=true;autosize(el);}
}

/* ---------- Navegação ---------- */
function render(){
  if(state.view==='form') renderForm(); else renderResult();
}
function go(step){state.step=step;state.view='form';render();window.scrollTo(0,0);}

app.addEventListener('change',function(e){
  var t=e.target;
  if(t.name==='mailkind'){state.mail.kind=t.value;state.mail.edited=false;mailFill();return;}
  if(t.hasAttribute&&t.hasAttribute('data-combo-input')){commitCombo(t);return;}
  if(state.view!=='form'||!t.name) return;
  if(t.type==='radio'){
    state.a[t.name]=t.value;
    if(t.name==='equip') state.a.partes=[];
    var q=t.closest('.q');if(q) q.classList.remove('bad');
    updateVisibility();
  }else if(t.type==='checkbox'){
    var NONE_BY_FIELD={partes:PARTES_NONE,recusa:RECUSA_NONE};
    var noneVal=NONE_BY_FIELD[t.name];
    if(noneVal){
      if(t.value===noneVal&&t.checked){state.a[t.name]=[noneVal];}
      else{
        var boxes=app.querySelectorAll('input[name="'+t.name+'"]:checked');
        state.a[t.name]=Array.prototype.map.call(boxes,function(b){return b.value;}).filter(function(v){return v!==noneVal;});
      }
      var q=t.closest('.q');
      if(q){var noneChecked=state.a[t.name].indexOf(noneVal)>-1;
        q.querySelectorAll('input[name="'+t.name+'"]').forEach(function(b){
          var mustClear=noneChecked&&b.value!==noneVal;
          b.disabled=mustClear;
          if(mustClear) b.checked=false;
        });
        q.classList.remove('bad');
      }
    }else{
      var boxes2=app.querySelectorAll('input[name="'+t.name+'"]:checked');
      state.a[t.name]=Array.prototype.map.call(boxes2,function(b){return b.value;});
    }
  }
});
app.addEventListener('input',function(e){
  var t=e.target;
  var id=t.getAttribute&&t.getAttribute('data-text');
  if(id){state.a[id]=t.value;if(id==='obs') refreshSuggestBox('obs',t.value);return;}
  if(t.hasAttribute&&t.hasAttribute('data-combo-input')){openCombo(t);return;}
  var mf=t.getAttribute&&t.getAttribute('data-mail');
  if(mf){mailInput(mf,t);if(mf==='update') refreshSuggestBox('update',t.value);}
});
app.addEventListener('focusin',function(e){
  var t=e.target;
  if(t.hasAttribute&&t.hasAttribute('data-combo-input')){
    openCombo(t);
    setTimeout(function(){t.closest('.combo').scrollIntoView({block:'start',behavior:reduceMotion()?'auto':'smooth'});},60);
  }
});
app.addEventListener('focusout',function(e){
  var t=e.target;
  if(t.hasAttribute&&t.hasAttribute('data-combo-input')) setTimeout(function(){if(document.activeElement!==t) closeCombo(t);},250);
});
app.addEventListener('keydown',function(e){var t=e.target;if(t.hasAttribute&&t.hasAttribute('data-combo-input')) comboKey(e,t);});
app.addEventListener('pointerdown',function(e){
  if(e.pointerType==='mouse'&&e.target.closest&&e.target.closest('.lb li')) e.preventDefault();
});
app.addEventListener('click',function(e){
  var li=e.target.closest&&e.target.closest('.lb li');
  if(li){pickFromLi(li);return;}
  var b=e.target.closest('[data-act]');
  if(!b||b.disabled) return;
  var act=b.getAttribute('data-act');
  if(act==='next'){
    if(!validateStep()) return;
    if(state.step<STEPS.length-1){state.step++;state.max=Math.max(state.max,state.step);render();window.scrollTo(0,0);}
    else{state.max=STEPS.length-1;state.view='result';render();window.scrollTo(0,0);}
  }else if(act==='back'){
    if(state.step>0) go(state.step-1);
  }else if(act==='goto'){
    var i=parseInt(b.getAttribute('data-i'),10);
    if(state.view==='form'&&i>state.step&&!validateStep()) return;
    go(i);
  }else if(act==='edit'){
    go(STEPS.length-1);
  }else if(act==='restart'){
    if(b.getAttribute('data-armed')==='1'){
      state=newState();render();window.scrollTo(0,0);
    }else{
      b.setAttribute('data-armed','1');
      b.textContent='Confirmar: apagar respostas';
      setTimeout(function(){if(b.isConnected){b.removeAttribute('data-armed');b.textContent='Nova avaliação';}},4000);
    }
  }else if(act==='copy'){
    copyText(summaryText()).then(function(ok){toast(ok?'Resumo copiado':'Não foi possível copiar. Use a opção de imprimir.');});
  }else if(act==='maker'){
    state.a.fab=state.a.fab==='Schneider Electric'?'':'Schneider Electric';
    var mi=app.querySelector('[data-combo-input="fab"]');
    if(mi){mi.value='';closeCombo(mi);}
    syncMaker();
  }else if(act==='mailto'){
    var to=state.mail.kind==='interno'?'':(tr(state.mail.contactEmail)||'');
    var su=app.querySelector('[data-mail="subject"]'),bo=app.querySelector('[data-mail="body"]');
    var subj=encodeURIComponent(su?su.value:''), body=encodeURIComponent(bo?bo.value:'');
    location.href='mailto:'+encodeURIComponent(to)+'?subject='+subj+'&body='+body;
  }else if(act==='copy-body'){
    var bt=app.querySelector('[data-mail="body"]');
    copyText(bt?bt.value:'').then(function(ok){toast(ok?'Mensagem copiada':'Não foi possível copiar. Selecione o texto e copie manualmente.');});
  }else if(act==='copy-subject'){
    var st=app.querySelector('[data-mail="subject"]');
    copyText(st?st.value:'').then(function(ok){toast(ok?'Assunto copiado':'Não foi possível copiar. Selecione o texto e copie manualmente.');});
  }else if(act==='pdf'){
    downloadPdf();
  }else if(act==='print'){
    window.print();
  }else if(act==='apply-suggest'||act==='dismiss-suggest'){
    var src=b.getAttribute('data-source'),key=b.getAttribute('data-key'),mode=b.getAttribute('data-mode');
    var dismissKey=src+':'+key+':'+mode;
    if(act==='dismiss-suggest'){
      state.suggestDismissed[dismissKey]=true;
    }else{
      var rule=SUGGEST_RULES.filter(function(r){return r.key===key;})[0];
      if(rule){
        var arr=(state.a.recusa||[]).filter(function(v){return v!==RECUSA_NONE;});
        var idx=arr.indexOf(rule.label);
        if(mode==='add'){ if(idx<0) arr.push(rule.label); }
        else{ if(idx>-1) arr.splice(idx,1); }
        state.a.recusa=arr;
        toast(mode==='add'?('Marcado: cliente não quer '+rule.label):('Removido: recusa de '+rule.label));
      }
    }
    render();
  }
});

render();
})();
</script>
